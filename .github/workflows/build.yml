name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.2"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: nitrate-tv-debug
          path: tv/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nitrate-mobile-debug
          path: mobile/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-screenshots
          path: mobile/build/outputs/roborazzi/*.png
