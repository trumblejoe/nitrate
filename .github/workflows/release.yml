name: Release

# Builds signed APKs for the phone/tablet and TV apps and publishes them as a GitHub release.
#  - Push a tag like v0.2.0 for a release.
#  - Or run it from the Actions tab ("Run workflow") for a test build from any branch,
#    published as a pre-release named dev-<run number>.
# Signed with the release key from repository secrets (NITRATE_KEYSTORE_BASE64,
# NITRATE_KEYSTORE_PASSWORD, NITRATE_KEY_ALIAS; see README, "Releases"). Without them, builds are
# signed with the public dev key in signing/ and published as "Nitrate Dev" pre-releases under
# their own app IDs.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # Reads Build's results for the commit ("Tested already?").
  checks: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # History and tags, for the "What's new" list since the last build.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.2 ndk;27.0.12077973 cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4

      # FFmpeg for the audio decoder (LGPL, audio-only; see ffmpeg-decoder/README.md). Built once
      # and cached until tools/build-ffmpeg.sh changes.
      - name: FFmpeg cache
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: ffmpeg-decoder/src/main/jni/ffmpeg
          key: ffmpeg-${{ hashFiles('tools/build-ffmpeg.sh') }}
      - name: Build FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: tools/build-ffmpeg.sh "$ANDROID_HOME/ndk/27.0.12077973"
      - name: Check FFmpeg
        run: test -f ffmpeg-decoder/src/main/jni/ffmpeg/android-libs/arm64-v8a/libavcodec.a
      # libass for styled subtitles (ISC, with FreeType, HarfBuzz and FriBidi; see
      # ass-renderer/README.md). Built once and cached until tools/build-libass.sh changes.
      - name: libass cache
        id: libass
        uses: actions/cache@v4
        with:
          path: ass-renderer/src/main/jni/libass/android-libs
          key: libass-${{ hashFiles('tools/build-libass.sh') }}
      - name: Build libass
        if: steps.libass.outputs.cache-hit != 'true'
        run: |
          pip install meson ninja
          tools/build-libass.sh "$ANDROID_HOME/ndk/27.0.12077973"
      - name: Check libass
        run: test -f ass-renderer/src/main/jni/libass/android-libs/arm64-v8a/lib/libass.a
      # libdovi (Rust, MIT) for Dolby Vision profile 7 as 8.1; see dovi-converter/README.md.
      # Built once and cached until tools/build-libdovi.sh changes.
      - name: libdovi cache
        id: libdovi
        uses: actions/cache@v4
        with:
          path: dovi-converter/src/main/jni/libdovi/android-libs
          key: libdovi-${{ hashFiles('tools/build-libdovi.sh') }}
      - name: Build libdovi
        if: steps.libdovi.outputs.cache-hit != 'true'
        run: tools/build-libdovi.sh "$ANDROID_HOME/ndk/27.0.12077973"
      - name: Check libdovi
        run: test -f dovi-converter/src/main/jni/libdovi/android-libs/arm64-v8a/libdovi.a

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NITRATE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NITRATE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NITRATE_KEY_ALIAS }}
        id: signing
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nitrate-release.jks"
            {
              echo "NITRATE_KEYSTORE_FILE=$RUNNER_TEMP/nitrate-release.jks"
              echo "NITRATE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "NITRATE_KEY_ALIAS=$KEY_ALIAS"
            } >> "$GITHUB_ENV"
            echo "dev=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No release key in secrets: signing with the public dev key (signing/README.md)."
            {
              echo "NITRATE_KEYSTORE_FILE=$GITHUB_WORKSPACE/signing/dev.jks"
              echo "NITRATE_KEYSTORE_PASSWORD=nitrate-dev"
              echo "NITRATE_KEY_ALIAS=nitrate-dev"
              echo "NITRATE_APP_ID_SUFFIX=.dev"
            } >> "$GITHUB_ENV"
            echo "dev=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Version
        id: version
        env:
          DEV_KEY: ${{ steps.signing.outputs.dev }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$DEV_KEY" != "true" ]; then
            tag="$GITHUB_REF_NAME"
            name="${tag#v}"
            prerelease=false
          else
            # A tag pushed without the release key still only makes a dev build.
            tag="dev-$GITHUB_RUN_NUMBER"
            name="0.0.0-dev.$GITHUB_RUN_NUMBER"
            prerelease=true
          fi
          # Run numbers only go up, so every build installs over the last one.
          echo "NITRATE_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "NITRATE_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      # The release itself is built at once, side by side with Build's tests (not after them).
      - name: Build
        run: ./gradlew assembleRelease --console=plain

      # Build (build.yml) tests every push to main. Its results are read once the release is built
      # (by then Build has usually finished; otherwise this waits, up to 30 minutes): when its
      # "android" and "companion" jobs passed for this very commit, their tests aren't run again
      # here. If either failed, nothing is released. With no Build for the commit (a tag on another
      # branch) or a part it skipped, that part is tested here.
      - name: Tested already?
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state() { echo "$runs" | awk -v n="$1" '$1==n {print $2" "$3; exit}'; }
          for i in $(seq 1 120); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
              -q '.check_runs[] | "\(.name) \(.status) \(.conclusion)"' || true)
            changes=$(state changes); android=$(state android); companion=$(state companion)
            # No Build at all for this commit (after a minute's grace for it to appear): test here.
            if [ -z "$changes" ] && [ "$i" -ge 4 ]; then break; fi
            waiting=false
            for s in "$changes" "$android" "$companion"; do
              case "$s" in queued*|in_progress*|waiting*|pending*) waiting=true ;; esac
            done
            # Build decided which parts to test once "changes" finished; those jobs follow it.
            if [ "$changes" = "completed success" ] && { [ -z "$android" ] || [ -z "$companion" ]; }; then waiting=true; fi
            if [ -n "$changes" ] && [ "$waiting" = false ]; then break; fi
            sleep 15
          done
          echo "Build's results: changes=[$changes] android=[$android] companion=[$companion]"
          for part in android companion; do
            s=$(state $part)
            case "$s" in
              "completed success") echo "$part=yes" >> "$GITHUB_OUTPUT" ;;
              "completed failure"|"completed cancelled"|"completed timed_out")
                echo "::error::Build's $part tests failed for this commit: not releasing."; exit 1 ;;
              *)
                # Build skipped this part (nothing of it changed) or never ran: an earlier commit's Build that
                # passed it counts, if nothing of that part changed since then (tools/changed-parts.py).
                tested=no
                for sha in $(gh api "repos/$GITHUB_REPOSITORY/commits?sha=$GITHUB_SHA&per_page=30" -q '.[1:][].sha' || true); do
                  was=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100" \
                    -q ".check_runs[] | select(.name == \"$part\") | \"\(.status) \(.conclusion)\"" 2>/dev/null | head -1 || true)
                  case "$was" in
                    "completed success")
                      files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...$GITHUB_SHA" -q '.files[].filename' || true)
                      count=$(printf '%s\n' "$files" | grep -c . || true)
                      if [ "$count" -lt 300 ] && python3 tools/changed-parts.py $files | grep -qx "$part=false"; then
                        echo "Build passed $part at ${sha:0:7}, and nothing of it changed since."
                        tested=yes
                      fi
                      break ;;
                    "completed skipped"|"") continue ;;
                    *) break ;;
                  esac
                done
                echo "$part=$tested" >> "$GITHUB_OUTPUT" ;;
            esac
          done

      - name: Test
        env:
          TESTED: ${{ steps.tested.outputs.android }}
        run: |
          if [ "$TESTED" = "yes" ]; then
            echo "Build already tested this commit."
          else
            ./gradlew test :core:jvmTest --console=plain
          fi

      # The Nitrate Companion server plugin: tested, built for Jellyfin's .NET. Two parts
      # (docs/features/companion-hotswap.md): the logic, zipped as a logic package and signed with
      # the COMPANION_LOGIC_SIGNING_KEY secret (an EC P-256 private key, PEM), which servers swap in
      # without a restart; and the shell Jellyfin loads, built with that key's public half and
      # zipped with meta.json and the logic package it starts from. Each is listed below only when
      # its sources changed. Without the secret the logic isn't signed or listed (no hot updates).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Companion plugin
        run: |
          companion_version="0.1.0.$GITHUB_RUN_NUMBER"
          echo "COMPANION_VERSION=$companion_version" >> "$GITHUB_ENV"
          if [ "$TESTED" != "yes" ]; then dotnet test companion/Nitrate.Companion.Tests --configuration Release; fi
          dotnet publish companion/Nitrate.Companion.Logic --configuration Release -o companion-logic-out -p:Version=$companion_version
          python3 tools/companion-manifest.py logic companion-logic-out "$companion_version" companion-logic.zip
          shell_flags=()
          if [ -n "$COMPANION_LOGIC_SIGNING_KEY" ]; then
            key="$RUNNER_TEMP/companion-logic-key.pem"
            (umask 077 && printf '%s\n' "$COMPANION_LOGIC_SIGNING_KEY" > "$key")
            openssl dgst -sha256 -sign "$key" -out companion-logic.sig companion-logic.zip
            public_key=$(openssl pkey -in "$key" -pubout -outform DER | base64 -w0)
            rm -f "$key"
            shell_flags+=("-p:LogicPublicKey=$public_key" "-p:LogicManifestUrl=https://github.com/$GITHUB_REPOSITORY/releases/download/companion-repo/logic.json")
            echo "COMPANION_LOGIC_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::COMPANION_LOGIC_SIGNING_KEY isn't set: the Companion's logic isn't signed, so servers take it only with a plugin update (restart)."
          fi
          dotnet publish companion/Nitrate.Companion --configuration Release -o companion-out -p:Version=$companion_version "${shell_flags[@]}"
          python3 tools/companion-manifest.py package companion-out "$companion_version" "$COMPANION_ABI" companion.zip companion-logic.zip
        env:
          COMPANION_ABI: "12.4.0.0"
          TESTED: ${{ steps.tested.outputs.companion }}
          COMPANION_LOGIC_SIGNING_KEY: ${{ secrets.COMPANION_LOGIC_SIGNING_KEY }}

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NAME: ${{ steps.version.outputs.name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          DEV_KEY: ${{ steps.signing.outputs.dev }}
        run: |
          mkdir dist
          cp mobile/build/outputs/apk/release/mobile-release.apk "dist/nitrate-mobile-$NAME.apk"
          cp tv/build/outputs/apk/release/tv-release.apk "dist/nitrate-tv-$NAME.apk"
          cp companion.zip "dist/nitrate-companion-$COMPANION_VERSION.zip"
          if [ "$COMPANION_LOGIC_SIGNED" = "true" ]; then cp companion-logic.zip "dist/nitrate-companion-logic-$COMPANION_VERSION.zip"; fi
          (cd dist && sha256sum *.apk > SHA256SUMS)
          # Commits since the previous build of the same kind; the apps show these when offering the update.
          if [ "$PRERELEASE" = "true" ]; then match='dev-*'; else match='v*'; fi
          previous=$(git describe --tags --abbrev=0 --match "$match" HEAD^ 2>/dev/null || true)
          if [ -n "$previous" ]; then range="$previous..HEAD"; else range="-8"; fi
          changes=$(git log $range --no-merges --format='- %s' | head -12)
          notes="Phone/tablet: nitrate-mobile-$NAME.apk · Android TV: nitrate-tv-$NAME.apk · iPhone/iPad (unsigned, sideload with AltStore, SideStore or Sideloadly): nitrate-ios-$NAME.ipa, added a little later · Windows (unsigned; Windows may ask before running it): nitrate-desktop-$NAME.msi to install, or nitrate-desktop-$NAME.zip to unzip and run, added a little later · Jellyfin server plugin: nitrate-companion-$COMPANION_VERSION.zip

          What's new:
          $changes

          Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}.
          <!-- nitrate-version-code: $NITRATE_VERSION_CODE -->"
          title="Nitrate $NAME"
          if [ "$DEV_KEY" = "true" ]; then
            title="Nitrate Dev $NAME"
            notes="$notes

          Signed with the public dev key: installs as a separate app (dev.nitrate.app.dev / dev.nitrate.tv.dev) and updates from later dev builds."
          fi
          flags=(--title "$title" --notes "$notes" --target "$GITHUB_SHA")
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          else
            flags+=(--generate-notes)
          fi
          gh release create "$TAG" dist/* "${flags[@]}"

          # The plugin repository Jellyfin reads (Dashboard -> Plugins -> Repositories): a manifest
          # kept on the fixed "companion-repo" release, listing each changed plugin build.
          repo_tag=companion-repo
          gh release view "$repo_tag" >/dev/null 2>&1 || gh release create "$repo_tag" --title "Nitrate Companion plugin repository" \
            --notes "Add https://github.com/$GITHUB_REPOSITORY/releases/download/$repo_tag/manifest.json in Jellyfin: Dashboard -> Plugins -> Repositories." --latest=false
          gh release download "$repo_tag" --pattern manifest.json --dir repo 2>/dev/null || mkdir -p repo
          # A new plugin version (installed by Jellyfin, runs after a restart) only when the shell or
          # its packaging changed; logic-only changes go to the logic list below and need no restart.
          source_hash="$(git rev-parse HEAD:companion/Nitrate.Companion)-$(git rev-parse HEAD:tools/companion-manifest.py)"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/nitrate-companion-$COMPANION_VERSION.zip"
          added=$(python3 tools/companion-manifest.py add repo/manifest.json "$COMPANION_VERSION" "12.4.0.0" companion.zip "$url" "$source_hash" "Built with $title")
          if [ "$added" = "added" ]; then gh release upload "$repo_tag" repo/manifest.json --clobber; fi
          # The logic list the shell checks (logic.json beside manifest.json): each signed logic build
          # whose sources changed.
          if [ "$COMPANION_LOGIC_SIGNED" = "true" ]; then
            gh release download "$repo_tag" --pattern logic.json --dir repo 2>/dev/null || true
            logic_hash="$(git rev-parse HEAD:companion/Nitrate.Companion.Logic)-$(git rev-parse HEAD:companion/Nitrate.Companion/Hosting)"
            logic_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/nitrate-companion-logic-$COMPANION_VERSION.zip"
            logic_added=$(python3 tools/companion-manifest.py logic-add repo/logic.json companion-logic.zip companion-logic.sig "$logic_url" "$logic_hash")
            if [ "$logic_added" = "added" ]; then gh release upload "$repo_tag" repo/logic.json --clobber; fi
          fi

  # The iPhone/iPad app is its own workflow (ios-release.yml): its Mac build takes 30+ minutes, and
  # here it held up every later release (releases queue one at a time). Started once the release
  # exists; it adds the .ipa when ready, and a newer release cancels an older iOS build.
  ios-start:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start the iOS build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
          NAME: ${{ needs.release.outputs.name }}
        run: |
          gh workflow run ios-release.yml --ref "$GITHUB_REF_NAME" \
            -f tag="$TAG" -f name="$NAME" -f number="$GITHUB_RUN_NUMBER" -f sha="$GITHUB_SHA" -f release_run="$GITHUB_RUN_ID"

  # The Windows app: libmpv built LGPL-only in MSYS2 (cached until the script changes), then the
  # MSI installer and a portable ZIP with their own Java runtime, built at the same time as the
  # Android apps; windows-publish adds them (and their checksums) once the release exists.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Version
        id: version
        shell: bash
        env:
          # The same rule as the release job: a tag makes a release only with the release key.
          HAS_KEY: ${{ secrets.NITRATE_KEYSTORE_BASE64 != '' && secrets.NITRATE_KEYSTORE_PASSWORD != '' && secrets.NITRATE_KEY_ALIAS != '' }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$HAS_KEY" = "true" ]; then
            name="${GITHUB_REF_NAME#v}"; channel=stable
          else
            name="0.0.0-dev.$GITHUB_RUN_NUMBER"; channel=dev
          fi
          {
            echo "NITRATE_VERSION_NAME=$name"
            echo "NITRATE_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))"
            echo "NITRATE_DESKTOP_CHANNEL=$channel"
          } >> "$GITHUB_ENV"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: libmpv cache
        id: libmpv
        uses: actions/cache@v4
        with:
          path: desktop/resources/windows-x64
          key: libmpv-windows-${{ hashFiles('tools/build-libmpv-windows.sh') }}
      - uses: msys2/setup-msys2@v2
        if: steps.libmpv.outputs.cache-hit != 'true'
        with:
          msystem: UCRT64
          update: true
      - name: Build libmpv (LGPL)
        if: steps.libmpv.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: tools/build-libmpv-windows.sh
      # The libmpv checks (it loads, it's the LGPL build) and the packaging in one Gradle run, so the
      # desktop app is compiled once.
      - name: Check libmpv and package
        shell: bash
        env:
          NAME: ${{ steps.version.outputs.name }}
          NITRATE_MPV_DIR: ${{ github.workspace }}/desktop/resources/windows-x64
          NITRATE_REQUIRE_MPV: "1"
        run: |
          test -f desktop/resources/windows-x64/libmpv-2.dll
          cat desktop/resources/windows-x64/licenses/DLLs.txt
          ./gradlew :desktop:test --tests '*LibMpvLoaderTest' --tests '*MpvIntegrationTest' \
            :desktop:packageMsi :desktop:createDistributable --console=plain
          mkdir -p dist
          cp desktop/build/compose/binaries/main/msi/*.msi "dist/nitrate-desktop-$NAME.msi"
          app=$(ls -d desktop/build/compose/binaries/main/app/*/ | head -1)
          # The portable copy knows not to run the installer when it updates.
          echo "Nitrate, portable: unzip anywhere and run the Nitrate .exe in this folder. Updates open the release page." > "$app/portable.txt"
          (cd "$app/.." && 7z a -tzip -mx=9 "$GITHUB_WORKSPACE/dist/nitrate-desktop-$NAME.zip" "$(basename "$app")" > /dev/null)
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: dist/*
          retention-days: 3

  # Adds the Windows app to the release as soon as it's built (never waiting for iOS).
  windows-publish:
    needs: [release, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-desktop
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
          NAME: ${{ needs.release.outputs.name }}
        run: |
          test -f "dist/nitrate-desktop-$NAME.msi"
          test -f "dist/nitrate-desktop-$NAME.zip"
          gh release upload "$TAG" "dist/nitrate-desktop-$NAME.msi" "dist/nitrate-desktop-$NAME.zip" --clobber

  # SHA256SUMS for everything the release ended up with, written once at the end (the apps' updaters
  # check downloads against it), so the publish jobs never rewrite it at the same time. The iOS
  # workflow writes it again after adding the .ipa, once this run has finished.
  checksums:
    needs: [release, windows-publish]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          mkdir files
          gh release download "$TAG" --dir files --pattern '*.apk' --pattern '*.ipa' --pattern '*.msi' --pattern '*.zip'
          (cd files && sha256sum * | sort -k2) > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
