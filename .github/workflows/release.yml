name: Release

# Builds signed APKs for the phone/tablet and TV apps and publishes them as a GitHub release.
#  - Push a tag like v0.2.0 for a release.
#  - Or run it from the Actions tab ("Run workflow") for a test build from any branch,
#    published as a pre-release named dev-<run number>.
# Signed with the release key from repository secrets (NITRATE_KEYSTORE_BASE64,
# NITRATE_KEYSTORE_PASSWORD, NITRATE_KEY_ALIAS; see README, "Releases"). Without them, builds are
# signed with the public dev key in signing/ and published as "Nitrate Dev" pre-releases under
# their own app IDs.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # History and tags, for the "What's new" list since the last build.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.2 ndk;27.0.12077973 cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4

      # FFmpeg for the audio decoder (LGPL, audio-only; see ffmpeg-decoder/README.md). Built once
      # and cached until tools/build-ffmpeg.sh changes.
      - name: FFmpeg cache
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: ffmpeg-decoder/src/main/jni/ffmpeg
          key: ffmpeg-${{ hashFiles('tools/build-ffmpeg.sh') }}
      - name: Build FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: tools/build-ffmpeg.sh "$ANDROID_HOME/ndk/27.0.12077973"
      - name: Check FFmpeg
        run: test -f ffmpeg-decoder/src/main/jni/ffmpeg/android-libs/arm64-v8a/libavcodec.a

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NITRATE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NITRATE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NITRATE_KEY_ALIAS }}
        id: signing
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nitrate-release.jks"
            {
              echo "NITRATE_KEYSTORE_FILE=$RUNNER_TEMP/nitrate-release.jks"
              echo "NITRATE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "NITRATE_KEY_ALIAS=$KEY_ALIAS"
            } >> "$GITHUB_ENV"
            echo "dev=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No release key in secrets: signing with the public dev key (signing/README.md)."
            {
              echo "NITRATE_KEYSTORE_FILE=$GITHUB_WORKSPACE/signing/dev.jks"
              echo "NITRATE_KEYSTORE_PASSWORD=nitrate-dev"
              echo "NITRATE_KEY_ALIAS=nitrate-dev"
              echo "NITRATE_APP_ID_SUFFIX=.dev"
            } >> "$GITHUB_ENV"
            echo "dev=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Version
        id: version
        env:
          DEV_KEY: ${{ steps.signing.outputs.dev }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$DEV_KEY" != "true" ]; then
            tag="$GITHUB_REF_NAME"
            name="${tag#v}"
            prerelease=false
          else
            # A tag pushed without the release key still only makes a dev build.
            tag="dev-$GITHUB_RUN_NUMBER"
            name="0.0.0-dev.$GITHUB_RUN_NUMBER"
            prerelease=true
          fi
          # Run numbers only go up, so every build installs over the last one.
          echo "NITRATE_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "NITRATE_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Test and build
        run: ./gradlew test :core:jvmTest assembleRelease --console=plain

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NAME: ${{ steps.version.outputs.name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          DEV_KEY: ${{ steps.signing.outputs.dev }}
        run: |
          mkdir dist
          cp mobile/build/outputs/apk/release/mobile-release.apk "dist/nitrate-mobile-$NAME.apk"
          cp tv/build/outputs/apk/release/tv-release.apk "dist/nitrate-tv-$NAME.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS)
          # Commits since the previous build of the same kind; the apps show these when offering the update.
          if [ "$PRERELEASE" = "true" ]; then match='dev-*'; else match='v*'; fi
          previous=$(git describe --tags --abbrev=0 --match "$match" HEAD^ 2>/dev/null || true)
          if [ -n "$previous" ]; then range="$previous..HEAD"; else range="-8"; fi
          changes=$(git log $range --no-merges --format='- %s' | head -12)
          notes="Phone/tablet: nitrate-mobile-$NAME.apk · Android TV: nitrate-tv-$NAME.apk

          What's new:
          $changes

          Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}.
          <!-- nitrate-version-code: $NITRATE_VERSION_CODE -->"
          title="Nitrate $NAME"
          if [ "$DEV_KEY" = "true" ]; then
            title="Nitrate Dev $NAME"
            notes="$notes

          Signed with the public dev key: installs as a separate app (dev.nitrate.app.dev / dev.nitrate.tv.dev) and updates from later dev builds."
          fi
          flags=(--title "$title" --notes "$notes" --target "$GITHUB_SHA")
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          else
            flags+=(--generate-notes)
          fi
          gh release create "$TAG" dist/* "${flags[@]}"
